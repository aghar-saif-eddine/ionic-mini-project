<ion-header>
  <ion-toolbar>
    <ion-title>Add a New Car</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Car Form -->
  <form [formGroup]="carForm" (ngSubmit)="submitCar()">
    <ion-item>
      <ion-label position="floating">Car Name</ion-label>
      <ion-input formControlName="name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Model</ion-label>
      <ion-input formControlName="model"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Year</ion-label>
      <ion-input formControlName="year" type="number"></ion-input>
    </ion-item>

    <ion-button expand="full" type="submit" [disabled]="carForm.invalid">
      Add Car
    </ion-button>
  </form>

</ion-content>
