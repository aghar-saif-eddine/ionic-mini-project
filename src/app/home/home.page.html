<ion-menu side="end" contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-item button routerLink="/profile" lines="none">
        <ion-icon name="person-circle-outline" slot="start"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-item>
      <ion-item button routerLink="/settings" lines="none">
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
      <ion-item button (click)="signOut()" lines="none">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Sign Out</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
      <ion-buttons slot="end">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <!-- Display List of Cars -->
      <ion-item *ngFor="let car of cars">
        <ion-label>
          <h2>{{ car.name }}</h2>
          <p>{{ car.model }} - {{ car.year }}</p>
        </ion-label>
        <ion-button fill="outline" color="danger" (click)="deleteCar(car.id)">
          Delete
        </ion-button>
        <ion-button fill="outline" color="tertiary" (click)="editCar(car)">
          Edit
        </ion-button>
      </ion-item>
    </ion-list>

    <!-- Add New Car Button -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
      <ion-fab-button [routerLink]="['/car']">
        <ion-icon name="add"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </ion-content>
</div>
